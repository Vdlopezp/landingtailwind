<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
</head>
<body class="bg-amber-500/80 ">
    <!-- NAVBAR -->
    <header class="w-full">
        <nav class="max-w-xl mx-auto px-7 py-12 p-8">
            <div class="items-center justify-between ">
    <div>
        <div class="relative">
            <div class="relative rounded-[28px] overflow-hidden shadow-2xl min-h-[400px] sm:min-h-[500px] 
            flex items-center justify-center bg-gradient-to-br from-amber-900 via-white/60 to-amber-600">
        <div class="text-center mb-8">
            <!-- LOGO -->
            <section class="w-full max-w-sm px-8 py-10 flex flex-col items-center">
            <div class="mb-3">
                <img 
                    src="/img/logo.png"
                    alt="Todo a la mano"
                    class="w-45 h-30 object-contain mx-auto rounded-3xl mb-7 "
                    

        <div class="flex flex-col sm:flex-row gap-6 mt-8 text-texto">
            <div class="flex items-center gap-2">
            </div>
            <div class="flex items-center gap-2">
            </div>
        </div>
        
        
        <!-- Formulario -->
        <form class="space-y-5 text-left">
            <!-- Campo Correo -->
            <div>
                <label class=" text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                    Nombre
                </label>
                <input type="text"placeholder="Ej: Victor"
                    class="w-full bg-white/50 border border-slate-200 rounded-xl px-4 py-3
                    text-black placeholder-slate-500 text-sm focus:outline-none focus:border-morado-100 focus:ring-1
                    focus:ring-morado-400 transition-all duration-200">
            </div>

            <div>
                <label class=" text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                    Apellido
                </label>
                <input type="text"placeholder="Ej: Lopez"
                    class="w-full bg-white/50 border border-slate-200 rounded-xl px-4 py-3
                    text-black placeholder-slate-500 text-sm focus:outline-none focus:border-morado-100 focus:ring-1
                    focus:ring-morado-400 transition-all duration-200">
            </div>

            <div>
                <label class=" text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                    Correo electronico 
                </label>
                <input type="email"placeholder="Ej: victor@gmail.com"
                    class="w-full bg-white/50 border border-slate-200 rounded-xl px-4 py-3
                    text-black placeholder-slate-500 text-sm focus:outline-none focus:border-morado-100 focus:ring-1
                    focus:ring-morado-400 transition-all duration-200">
            </div>

            
            <!-- Campo Contraseña -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-semibold text-slate-700 uppercase tracking-wider">
                        Contraseña
                    </label>
                    
                </div>
                <input type="password" placeholder="••••••••••••"
                    class="w-full bg-white/50 border border-slate-200 rounded-xl px-4 py-3 text-black placeholder-slate-500 text-sm focus:outline-none 
                    focus:border-morado-100 focus:ring-1 focus:ring-morado-400 transition-all duration-200">
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-semibold text-slate-700 uppercase tracking-wider">
                        Confirma tu Contraseña
                    </label>
                    
                </div>
                <input type="password" placeholder="••••••••••••"
                    class="w-full bg-white/50 border border-slate-200 rounded-xl px-4 py-3 text-black placeholder-slate-500 text-sm focus:outline-none 
                    focus:border-morado-100 focus:ring-1 focus:ring-morado-400 transition-all duration-200">
            </div>
    
           
        <div class="text-center bg-amber-900/20 rounded-3xl hover:bg-amber-500/40">
            <a href="/index.html"
            class="w-full text-black px-5 py-2 rounded-lg font-medium text-sm shadow-boton">
        
                Registrate
            </a>
        </div>
    </div>
    </div>
</body>
</html>
